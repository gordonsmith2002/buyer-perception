<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1419">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Behaviour">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Behaviour</title>
  <style>
    :root {
      --surface: #0f1419;
      --card: #1a1f26;
      --border: #2a3139;
      --muted: #6b7280;
      --text: #f3f4f6;
      --text-dim: #e5e7eb;
      --text-soft: #d1d5db;
      --accent: #166534;
      --accent-bright: #22c55e;
      --placeholder: #4b5563;
    }

    *, *::before, *::after { box-sizing: border-box; }
    * { -webkit-tap-highlight-color: transparent; margin: 0; }

    html {
      background: var(--surface);
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--surface);
      color: var(--text);
      min-height: 100dvh;
      min-height: 100vh;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    button, input, textarea { font: inherit; color: inherit; }

    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      background: rgba(15, 20, 25, 0.96);
      border-bottom: 1px solid rgba(42, 49, 57, 0.5);
      padding: env(safe-area-inset-top, 0) 1rem 0;
    }

    .identity {
      max-width: 32rem;
      margin: 0 auto;
      padding: 0.75rem 0;
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
    }

    #app {
      max-width: 32rem;
      margin: 0 auto;
      padding: 4.75rem 1rem calc(5rem + env(safe-area-inset-bottom, 0));
    }

    .nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      background: rgba(26, 31, 38, 0.96);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .nav-inner {
      max-width: 32rem;
      margin: 0 auto;
      display: flex;
    }

    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 0.85rem 0.5rem;
      font-size: 0.875rem;
      color: var(--muted);
      cursor: pointer;
    }

    .nav-btn.active { color: var(--accent-bright); }

    .nav-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-bright);
      margin-left: 4px;
      vertical-align: middle;
    }

    .stack > * + * { margin-top: 1.5rem; }
    .stack-sm > * + * { margin-top: 0.5rem; }
    .stack-md > * + * { margin-top: 0.75rem; }
    .stack-lg > * + * { margin-top: 1.25rem; }

    .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .row-center {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    h1 {
      font-size: 1.125rem;
      font-weight: 500;
      color: var(--text-dim);
    }

    .muted { color: var(--muted); font-size: 0.875rem; }
    .label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .prompt {
      display: block;
      font-size: 0.875rem;
      color: var(--text-soft);
      margin-bottom: 0.5rem;
    }

    .anchor-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .anchor-input::placeholder { color: var(--placeholder); }
    .anchor-input:focus { box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25); }

    textarea.field {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: var(--text);
      outline: none;
      resize: none;
      -webkit-appearance: none;
      appearance: none;
    }

    textarea.field::placeholder { color: var(--placeholder); }
    textarea.field:focus { border-color: rgba(22, 101, 52, 0.5); }

    .toggle-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
      text-align: left;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .toggle-btn:active { transform: scale(0.97); }
    .toggle-btn.on {
      border-color: var(--accent-bright);
      background: rgba(34, 197, 94, 0.12);
    }

    .toggle-circle {
      flex-shrink: 0;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-btn.on .toggle-circle {
      border-color: var(--accent-bright);
      background: rgba(34, 197, 94, 0.2);
    }

    .toggle-check {
      width: 1rem;
      height: 1rem;
      color: var(--accent-bright);
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toggle-btn.on .toggle-check {
      opacity: 1;
      transform: scale(1);
    }

    .toggle-label {
      display: block;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }

    .toggle-sub {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.125rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--text);
      margin-top: 0.25rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .export-btn {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: var(--text-soft);
      cursor: pointer;
    }

    details.past {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
    }

    details.past summary {
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: var(--text-soft);
      cursor: pointer;
      list-style: none;
      user-select: none;
      -webkit-user-select: none;
    }

    details.past summary::-webkit-details-marker { display: none; }

    details.past .past-body {
      padding: 0.75rem 1rem 1rem;
      border-top: 1px solid rgba(42, 49, 57, 0.5);
    }

    details.past .past-body > * + * { margin-top: 0.75rem; }

    .past-q { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
    .past-a { font-size: 0.875rem; color: var(--text-soft); white-space: pre-wrap; }

    .heat-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .heat-row { display: flex; gap: 3px; }
    .heat-col { display: flex; flex-direction: column; gap: 3px; }
    .heat-labels { padding-top: 18px; padding-right: 4px; }

    .heat-cell {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 9px;
      color: var(--muted);
      line-height: 1;
    }

    @media (min-width: 380px) {
      .heat-cell { width: 13px; height: 13px; }
    }

    .heat-0 { background: #1a1f26; }
    .heat-1 { background: rgba(22, 101, 52, 0.3); }
    .heat-2 { background: rgba(22, 101, 52, 0.5); }
    .heat-3 { background: rgba(22, 101, 52, 0.7); }
    .heat-4 { background: rgba(34, 197, 94, 0.8); }

    .legend {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 0.75rem;
      font-size: 10px;
      color: var(--muted);
    }

    .rate-label {
      font-size: 0.875rem;
      color: var(--text-soft);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 1rem;
    }

    .rate-val {
      flex-shrink: 0;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .hint { font-size: 0.875rem; color: var(--muted); }
  </style>
</head>
<body>
  <header class="header">
    <p class="identity">
      I trust my own judgement. I use daily discipline to give me the focus I need to find the right path.
    </p>
  </header>

  <main id="app"></main>

  <nav class="nav">
    <div class="nav-inner">
      <button type="button" data-nav="today" class="nav-btn active">Today</button>
      <button type="button" data-nav="audit" class="nav-btn">Audit</button>
      <button type="button" data-nav="history" class="nav-btn">History</button>
    </div>
  </nav>

  <script>
    (function () {
      'use strict';

      var STORAGE_KEY = 'behaviour-tracker-v1';

      var BEHAVIOURS = [
        { id: 'morningPractice', label: 'Morning practice', sub: '10 min — belief rep + execution anchor' },
        { id: 'bdBlock', label: 'BD block 9:00–10:30', sub: 'Protected, no exceptions' },
        { id: 'financialCheck', label: 'Financial check', sub: 'Daily monitoring' },
        { id: 'physicalTraining', label: 'Physical training / movement', sub: '' },
        { id: 'eveningShutdown', label: 'Evening shutdown', sub: 'Phone down, fully present with family' }
      ];

      var AUDIT_PROMPTS = [
        { id: 'boundary', label: 'Where did the boundary nearly break this week?' },
        { id: 'engine', label: 'Where did the engine fire, and how fast did it lose?' },
        { id: 'identity', label: 'What did the identity line do this week?' }
      ];

      var state = loadData();
      var currentView = 'today';

      function defaultData() {
        return { meta: { lastVisit: null, version: 1 }, days: {}, weeks: {}, audits: {} };
      }

      function loadData() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultData();
          var parsed = JSON.parse(raw);
          return {
            meta: parsed.meta || { lastVisit: null, version: 1 },
            days: parsed.days || {},
            weeks: parsed.weeks || {},
            audits: parsed.audits || {}
          };
        } catch (e) {
          return defaultData();
        }
      }

      function saveData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) { /* private mode / quota */ }
      }

      function dateKey(d) {
        d = d || new Date();
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1);
        var day = String(d.getDate());
        if (m.length < 2) m = '0' + m;
        if (day.length < 2) day = '0' + day;
        return y + '-' + m + '-' + day;
      }

      function weekKey(d) {
        d = d || new Date();
        var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        var day = date.getUTCDay() || 7;
        date.setUTCDate(date.getUTCDate() + 4 - day);
        var year = date.getUTCFullYear();
        var jan1 = new Date(Date.UTC(year, 0, 1));
        var week = Math.ceil((((date - jan1) / 86400000) + 1) / 7);
        var w = String(week);
        if (w.length < 2) w = '0' + w;
        return year + '-W' + w;
      }

      function formatDisplayDate(d) {
        return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
      }

      function isSunday(d) {
        return (d || new Date()).getDay() === 0;
      }

      function addDays(d, n) {
        var r = new Date(d.getTime());
        r.setDate(r.getDate() + n);
        return r;
      }

      function handleRollover() {
        state.meta.lastVisit = dateKey();
        saveData();
      }

      function emptyBehaviours() {
        var o = {};
        for (var i = 0; i < BEHAVIOURS.length; i++) o[BEHAVIOURS[i].id] = false;
        return o;
      }

      function getDayRecord(key) {
        key = key || dateKey();
        if (!state.days[key]) {
          state.days[key] = { executionAnchor: '', behaviours: emptyBehaviours() };
        }
        return state.days[key];
      }

      function getWeekRecord(key) {
        key = key || weekKey();
        if (!state.weeks[key]) {
          state.weeks[key] = { peerConnection: false, sundayAudit: false };
        }
        return state.weeks[key];
      }

      function getAuditRecord(key) {
        key = key || weekKey();
        if (!state.audits[key]) {
          state.audits[key] = { boundary: '', engine: '', identity: '' };
        }
        return state.audits[key];
      }

      function dayCompletion(day) {
        if (!day || !day.behaviours) return 0;
        var done = 0;
        for (var i = 0; i < BEHAVIOURS.length; i++) {
          if (day.behaviours[BEHAVIOURS[i].id]) done++;
        }
        return done / BEHAVIOURS.length;
      }

      function getStreak() {
        var streak = 0;
        var today = new Date();
        var offset = 0;
        if (!getDayRecord(dateKey(today)).behaviours.morningPractice) offset = 1;
        for (var i = offset; ; i++) {
          var rec = state.days[dateKey(addDays(today, -i))];
          if (rec && rec.behaviours && rec.behaviours.morningPractice) streak++;
          else break;
        }
        return streak;
      }

      function getLongestStreak() {
        var keys = Object.keys(state.days).sort();
        if (!keys.length) return 0;
        var longest = 0;
        var current = 0;
        var start = new Date(keys[0] + 'T12:00:00');
        var end = new Date();
        for (var d = new Date(start.getTime()); d <= end; d = addDays(d, 1)) {
          var rec = state.days[dateKey(d)];
          if (rec && rec.behaviours && rec.behaviours.morningPractice) {
            current++;
            if (current > longest) longest = current;
          } else {
            current = 0;
          }
        }
        return longest;
      }

      function behaviourRate(id, days) {
        days = days || 30;
        var done = 0;
        var today = new Date();
        for (var i = 0; i < days; i++) {
          var rec = state.days[dateKey(addDays(today, -i))];
          if (rec && rec.behaviours && rec.behaviours[id]) done++;
        }
        return Math.round((done / days) * 100);
      }

      function heatLevel(pct) {
        if (pct === 0) return 'heat-0';
        if (pct <= 0.25) return 'heat-1';
        if (pct <= 0.5) return 'heat-2';
        if (pct <= 0.75) return 'heat-3';
        return 'heat-4';
      }

      function esc(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function render() {
        var app = document.getElementById('app');
        if (currentView === 'today') app.innerHTML = renderToday();
        else if (currentView === 'audit') app.innerHTML = renderAudit();
        else app.innerHTML = renderHistory();
        bindEvents();
      }

      function toggleHTML(scope, id, label, sub, on) {
        return (
          '<button type="button" data-toggle="' + scope + ':' + id + '" class="toggle-btn' + (on ? ' on' : '') + '" aria-pressed="' + on + '">' +
            '<span class="toggle-circle">' +
              '<svg class="toggle-check" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">' +
                '<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>' +
              '</svg>' +
            '</span>' +
            '<span style="flex:1;min-width:0">' +
              '<span class="toggle-label">' + esc(label) + '</span>' +
              (sub ? '<span class="toggle-sub">' + esc(sub) + '</span>' : '') +
            '</span>' +
          '</button>'
        );
      }

      function renderToday() {
        var today = new Date();
        var day = getDayRecord();
        var week = getWeekRecord();
        var sunday = isSunday(today);
        var streak = getStreak();
        var hasData = Object.keys(state.days).length > 0 || day.executionAnchor;
        var html = '<section class="stack">';
        html += '<div class="row">';
        html += '<h1>' + esc(formatDisplayDate(today)) + '</h1>';
        html += '<span class="muted">' + (streak > 0 ? streak + ' day streak' : 'No streak') + '</span>';
        html += '</div>';
        if (!hasData) {
          html += '<p class="hint">Set your execution anchor. Toggle behaviours as you complete them.</p>';
        }
        html += '<div>';
        html += '<label for="anchor" class="label">Execution anchor</label>';
        html += '<input id="anchor" type="text" class="anchor-input" placeholder="What does the person who\'s already there do today?" value="' + esc(day.executionAnchor) + '" autocomplete="off" enterkeyhint="done"/>';
        html += '</div>';
        html += '<div><h2 class="label">Daily behaviours</h2><div class="stack-sm">';
        for (var i = 0; i < BEHAVIOURS.length; i++) {
          var b = BEHAVIOURS[i];
          html += toggleHTML('day', b.id, b.label, b.sub, !!day.behaviours[b.id]);
        }
        html += '</div></div>';
        html += '<div><h2 class="label">This week</h2><div class="stack-sm">';
        html += toggleHTML('week', 'peerConnection', 'One peer connection touchpoint', 'Message, call, or meet', !!week.peerConnection);
        if (sunday) {
          html += toggleHTML('week', 'sundayAudit', 'Sunday audit', 'Weekly reflection complete', !!week.sundayAudit);
        }
        html += '</div></div></section>';
        return html;
      }

      function formatWeekLabel(wk) {
        var parts = wk.split('-W');
        return 'W' + parts[1] + ' ' + parts[0];
      }

      function renderPastAudit(wk, audit) {
        var html = '<details class="past"><summary>' + esc(formatWeekLabel(wk)) + '</summary><div class="past-body">';
        for (var i = 0; i < AUDIT_PROMPTS.length; i++) {
          var p = AUDIT_PROMPTS[i];
          if (audit[p.id]) {
            html += '<div><p class="past-q">' + esc(p.label) + '</p><p class="past-a">' + esc(audit[p.id]) + '</p></div>';
          }
        }
        html += '</div></details>';
        return html;
      }

      function renderAudit() {
        var wk = weekKey();
        var audit = getAuditRecord(wk);
        var pastKeys = Object.keys(state.audits).filter(function (k) {
          if (k === wk) return false;
          var a = state.audits[k];
          return !!(a.boundary || a.engine || a.identity);
        }).sort().reverse();

        var html = '<section class="stack">';
        html += '<div><h1>Sunday audit</h1><p class="muted" style="margin-top:0.25rem">Week of ' + esc(formatWeekLabel(wk)) + '</p></div>';
        if (!isSunday()) {
          html += '<p class="hint">Reflection prompts are saved per week. Edit anytime.</p>';
        }
        html += '<div class="stack-lg">';
        for (var i = 0; i < AUDIT_PROMPTS.length; i++) {
          var p = AUDIT_PROMPTS[i];
          html += '<div><label class="prompt">' + esc(p.label) + '</label>';
          html += '<textarea data-audit="' + p.id + '" rows="3" class="field" placeholder="Write here…">' + esc(audit[p.id]) + '</textarea></div>';
        }
        html += '</div>';
        if (pastKeys.length) {
          html += '<div><h2 class="label">Previous weeks</h2><div class="stack-sm">';
          for (var j = 0; j < pastKeys.length; j++) {
            html += renderPastAudit(pastKeys[j], state.audits[pastKeys[j]]);
          }
          html += '</div></div>';
        }
        html += '</section>';
        return html;
      }

      function renderHeatMap() {
        var today = new Date();
        var start = addDays(today, -83);
        var startDay = start.getDay();
        var weeks = [];
        var cursor = addDays(start, -startDay);
        while (cursor <= today) {
          var week = [];
          for (var d = 0; d < 7; d++) {
            var date = addDays(cursor, d);
            if (date > today || date < start) week.push(null);
            else {
              var rec = state.days[dateKey(date)];
              week.push(rec ? dayCompletion(rec) : 0);
            }
          }
          weeks.push(week);
          cursor = addDays(cursor, 7);
        }

        var dayLabels = ['', 'M', '', 'W', '', 'F', ''];
        var html = '<div class="heat-row">';
        html += '<div class="heat-col heat-labels">';
        for (var i = 0; i < dayLabels.length; i++) {
          html += '<span class="heat-cell">' + dayLabels[i] + '</span>';
        }
        html += '</div><div class="heat-row">';
        for (var w = 0; w < weeks.length; w++) {
          html += '<div class="heat-col">';
          for (var dd = 0; dd < 7; dd++) {
            var pct = weeks[w][dd];
            if (pct === null) html += '<span class="heat-cell"></span>';
            else html += '<span class="heat-cell ' + heatLevel(pct) + '" title="' + Math.round(pct * 100) + '%"></span>';
          }
          html += '</div>';
        }
        html += '</div></div>';
        return html;
      }

      function renderHistory() {
        var streak = getStreak();
        var longest = getLongestStreak();
        var hasAny = Object.keys(state.days).length > 0;
        var html = '<section class="stack"><h1>History</h1>';
        if (!hasAny) html += '<p class="hint">Your activity will appear here after your first day.</p>';
        html += '<div><h2 class="label">Last 12 weeks</h2><div class="heat-wrap">' + renderHeatMap() + '</div>';
        html += '<div class="legend"><span>Less</span>';
        html += '<span class="heat-cell heat-0"></span><span class="heat-cell heat-1"></span>';
        html += '<span class="heat-cell heat-2"></span><span class="heat-cell heat-3"></span>';
        html += '<span class="heat-cell heat-4"></span><span>More</span></div></div>';
        html += '<div class="grid-2">';
        html += '<div class="card"><p class="muted" style="font-size:0.75rem">Current streak</p><p class="stat-value">' + streak + '</p></div>';
        html += '<div class="card"><p class="muted" style="font-size:0.75rem">Longest streak</p><p class="stat-value">' + longest + '</p></div>';
        html += '</div>';
        html += '<div><h2 class="label">Last 30 days</h2><div class="stack-sm">';
        for (var i = 0; i < BEHAVIOURS.length; i++) {
          var b = BEHAVIOURS[i];
          html += '<div class="row-center"><span class="rate-label">' + esc(b.label) + '</span><span class="rate-val">' + behaviourRate(b.id) + '%</span></div>';
        }
        html += '</div></div>';
        html += '<button type="button" id="export-btn" class="export-btn">Export all data</button>';
        html += '</section>';
        return html;
      }

      function bindEvents() {
        var anchor = document.getElementById('anchor');
        if (anchor) {
          anchor.addEventListener('blur', function () {
            getDayRecord().executionAnchor = anchor.value.replace(/^\s+|\s+$/g, '');
            saveData();
          });
        }

        var toggles = document.querySelectorAll('[data-toggle]');
        for (var i = 0; i < toggles.length; i++) {
          toggles[i].addEventListener('click', function (e) {
            var btn = e.currentTarget;
            var parts = btn.getAttribute('data-toggle').split(':');
            var scope = parts[0];
            var id = parts[1];
            var on;
            if (scope === 'day') {
              var day = getDayRecord();
              day.behaviours[id] = !day.behaviours[id];
              on = day.behaviours[id];
            } else {
              var week = getWeekRecord();
              week[id] = !week[id];
              on = week[id];
            }
            saveData();
            if (on) btn.classList.add('on');
            else btn.classList.remove('on');
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            if (currentView === 'today' && id === 'morningPractice') {
              var header = document.querySelector('section .row');
              if (header) {
                var span = header.querySelector('.muted');
                var streak = getStreak();
                if (span) span.textContent = streak > 0 ? streak + ' day streak' : 'No streak';
              }
            }
          });
        }

        var audits = document.querySelectorAll('[data-audit]');
        for (var j = 0; j < audits.length; j++) {
          audits[j].addEventListener('blur', function (e) {
            var ta = e.currentTarget;
            getAuditRecord()[ta.getAttribute('data-audit')] = ta.value;
            saveData();
          });
        }

        var exportBtn = document.getElementById('export-btn');
        if (exportBtn) exportBtn.addEventListener('click', exportData);
      }

      function exportData() {
        var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'behaviour-tracker-' + dateKey() + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 500);
      }

      function updateNavIndicators() {
        var auditBtn = document.querySelector('[data-nav="audit"]');
        if (!auditBtn) return;
        var audit = getAuditRecord();
        var needsAudit = isSunday() && !audit.boundary && !audit.engine && !audit.identity;
        var dot = auditBtn.querySelector('.nav-dot');
        if (needsAudit) {
          if (!dot) {
            dot = document.createElement('span');
            dot.className = 'nav-dot';
            auditBtn.appendChild(dot);
          }
        } else if (dot) {
          dot.parentNode.removeChild(dot);
        }
      }

      function setView(view) {
        currentView = view;
        var btns = document.querySelectorAll('.nav-btn');
        for (var i = 0; i < btns.length; i++) {
          if (btns[i].getAttribute('data-nav') === view) btns[i].classList.add('active');
          else btns[i].classList.remove('active');
        }
        updateNavIndicators();
        render();
      }

      function init() {
        handleRollover();

        var btns = document.querySelectorAll('.nav-btn');
        for (var i = 0; i < btns.length; i++) {
          btns[i].addEventListener('click', function (e) {
            setView(e.currentTarget.getAttribute('data-nav'));
          });
        }

        if (isSunday()) {
          var audit = getAuditRecord();
          if (!audit.boundary && !audit.engine && !audit.identity) currentView = 'audit';
        }

        setView(currentView);

        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) {
            handleRollover();
            render();
          }
        });

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
